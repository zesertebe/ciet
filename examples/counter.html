<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ciet — Counter demo</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f5f5f5; }
    .card { background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,.1); text-align: center; }
    .count { font-size: 48px; font-weight: 700; color: #333; margin: 16px 0; }
    .double { font-size: 18px; color: #666; }
    .btn { border: none; border-radius: 8px; padding: 10px 24px; font-size: 16px; cursor: pointer; margin: 0 4px; transition: background .2s; }
    .btn-primary { background: #0066ff; color: #fff; }
    .btn-primary:hover { background: #0052cc; }
    .btn-secondary { background: #e0e0e0; color: #333; }
    .btn-secondary:hover { background: #ccc; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="../dist/content.js"></script>
  <script>
    const { signal, computed, effect } = Ciet

    // Estado
    const count = signal(0)
    const doubled = computed(() => count.value * 2)

    // UI
    const card = Ciet.create("div", { class: "card", container: "#app" })
    Ciet.create("h2", { text: "Contador Reactivo", container: card })

    const countEl = Ciet.create("div", { class: "count", text: "0", container: card })
    const doubleEl = Ciet.create("div", { class: "double", text: "doble: 0", container: card })

    effect(() => {
      countEl.textContent = String(count.value)
      doubleEl.textContent = `doble: ${doubled.value}`
    })

    const btnGroup = Ciet.create("div", {
      style: { marginTop: "16px", display: "flex", gap: "8px", justifyContent: "center" },
      container: card,
    })

    Ciet.create("button", {
      class: "btn btn-primary",
      text: "+1",
      events: { click: () => count.value++ },
      container: btnGroup,
    })
    Ciet.create("button", {
      class: "btn btn-secondary",
      text: "-1",
      events: { click: () => count.value-- },
      container: btnGroup,
    })
    Ciet.create("button", {
      class: "btn btn-secondary",
      text: "Reset",
      events: { click: () => count.value = 0 },
      container: btnGroup,
    })
  </script>
</body>
</html>
